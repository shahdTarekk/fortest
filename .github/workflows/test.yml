name: ml pipeline 
on:
 push:
  branches: [main]
jobs:
 check:
   runs-on: ubuntu-latest
   steps:
     - name: checkout code
       uses: actions/checkout@v4
     - name: setup python 
       uses: actions/setup-python@v4
       with: 
        python-version: "3.10"
     - name: install dependcies
       run: pip install flake8 
     - name: check code 
       run: echo "check code quality"
 train:
  needs: check 
  if: contains(github.event.head_commit.message , '[train]')
  runs-on: ubuntu-latest
  steps:
   - name: checkout code
     uses: actions/checkout@v4
   - name: setup python 
     uses: actions/setup-python@v4
     with: 
      python-version: "3.10"
   - name: train model
     run: python train.py > train.log
   - name: save logs
     if: failure()
     uses: actions/upload-artifact@v4
     with: 
      name: training_logs
      path: train.log
   - name: evaluate
     if: success()
     run: pythin evaluate.py 
   - name: cleaning 
     if: always()
     run: echo "cleaning"
     
   
          
